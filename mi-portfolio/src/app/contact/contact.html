<section class="contact">
  <h2>Contacto</h2>
  <div class="contact-container">
    <div class="contact-info">
      <h3>¡Ponete en contacto conmigo!</h3>
      <p>Podes contactarme a través de los siguientes medios:</p>
      
      <div class="contact-item">
        <h4>Email</h4>
        <p><a href="mailto:albrechtliwen1@gmail.com">albrechtliwen1@gmail.com</a></p>
      </div>
      
      <div class="contact-item">
        <h4>Redes Sociales</h4>
        <ul class="social-links">
          <li><a href="https://github.com/liwen713" target="_blank">GitHub</a></li>
        </ul>
      </div>
    </div>
    
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="message">Tu Mensaje:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      
      <button type="submit" class="btn-submit">Enviar</button>
    </form>
  </div>
</section>
